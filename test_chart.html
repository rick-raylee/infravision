<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
    <div id="chart"></div>
    <script>
        var options = {
            series: [70],
            chart: { type: 'radialBar', height: 300 },
            colors: [function(opts) {
                console.log(opts);
                // opts.value does not exist for radialBar in all versions. It usually passes { seriesIndex, w }
                var val = opts.w.globals.series[0];
                if (val < 60) return '#10b981';
                if (val < 85) return '#f59e0b';
                return '#ef4444';
            }],
            fill: { type: 'solid' }
        };
        var chart = new ApexCharts(document.querySelector("#chart"), options);
        chart.render();
        
        setTimeout(() => {
            chart.updateSeries([90]);
        }, 2000);
    </script>
</body>
</html>
